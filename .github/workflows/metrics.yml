name: 3D contribution calendar

on:
  schedule:
    - cron: "17 20 * * *" # 03:17 Asia/Bangkok
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: read

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Generate 3D calendar with read-only access
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: actions/upload-artifact@v4
        with:
          name: profile-3d
          path: profile-3d-contrib/*.svg
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: profile-3d
          path: profile-3d-contrib
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution calendar"
            git push
          fi
